# 01-jenkins-storage.yaml
# Namespace + StorageClass + local PersistentVolume for Jenkins.
#
# BEFORE APPLYING, on the worker node that will hold the data (replace <NODE_NAME>):
#   sudo mkdir -p /data/jenkins
#   sudo chown -R 1000:1000 /data/jenkins     # Jenkins runs as uid 1000
#   sudo chmod 755 /data/jenkins
# Find node names with:  kubectl get nodes
---
apiVersion: v1
kind: Namespace
metadata:
  name: jenkins
---
# No dynamic provisioning: PVs are created by hand.
# WaitForFirstConsumer delays binding until the pod is scheduled.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-storage
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: jenkins-pv
  labels:
    app: jenkins
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  # Pre-bind to the PVC that the StatefulSet's volumeClaimTemplate will create:
  # name format = <template-name>-<statefulset-name>-<ordinal>
  claimRef:
    namespace: jenkins
    name: jenkins-home-jenkins-0
  local:
    path: /data/jenkins            # directory on the node (must already exist)
  nodeAffinity:                    # required for local volumes
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - <NODE_NAME>      # CHANGE: e.g. node01
